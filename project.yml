name: CoreScopeViewer
options:
  bundleIdPrefix: com.meshtexas
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

# Files kept in the project navigator without belonging to a build phase.
fileGroups:
  - NodeScope.storekit

targets:
  CoreScopeViewer:
    type: application
    productName: NodeScope
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: CoreScopeViewer
      - path: shared/widget/MyNodesWidgetCatalog.swift
      - path: shared/analyzer-sources/texas-boundary.json
        buildPhase: resources
    dependencies:
      - target: MyNodesPrototype
    settings:
      base:
        PRODUCT_NAME: NodeScope
        PRODUCT_MODULE_NAME: CoreScopeViewer
        PRODUCT_BUNDLE_IDENTIFIER: com.btdev.nodescope
        DEVELOPMENT_TEAM: CW335GEDYX
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: NodeVision uses the camera to show the direction of nearby mesh nodes.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Your location helps center maps, sort analyzer sources by distance, and guide you in Field Tools and NodeVision while you use the app.
        INFOPLIST_KEY_CFBundleDisplayName: NodeScope
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: CoreScopeViewer/NodeScopeStaging.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) NODESCOPE_PUSH_STAGING"
        Release:
          CODE_SIGN_ENTITLEMENTS: CoreScopeViewer/NodeScopeProduction.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) NODESCOPE_PUSH_PRODUCTION"

  MyNodesPrototype:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: MyNodesPrototype
        excludes: [Info.plist, MyNodesPrototype.entitlements]
      - path: shared/widget/MyNodesWidgetCatalog.swift
      - path: CoreScopeViewer/Features/Shared/AppFont.swift
      - path: CoreScopeViewer/Features/Shared/MeshBackground.swift
      - path: CoreScopeViewer/Features/Settings/AppearanceSettings.swift
      - path: CoreScopeViewer/Resources/MonaspaceNeon-Regular.otf
        buildPhase: resources
      - path: CoreScopeViewer/Resources/MonaspaceNeon-SemiBold.otf
        buildPhase: resources
      - path: CoreScopeViewer/Resources/Monaspace-OFL.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.btdev.nodescope.MyNodesPrototype
        DEVELOPMENT_TEAM: CW335GEDYX
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: MyNodesPrototype/MyNodesPrototype.entitlements
        INFOPLIST_FILE: MyNodesPrototype/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES

  CoreScopeViewerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: CoreScopeViewerTests
    dependencies:
      - target: CoreScopeViewer
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NodeScope.app/NodeScope"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CoreScopeViewer:
    build:
      targets:
        CoreScopeViewer: all
        CoreScopeViewerTests: [test]
    test:
      targets:
        - CoreScopeViewerTests
    run:
      config: Debug
    archive:
      config: Release
